<!doctype html>
<html lang="hi" data-theme="night">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kahaani AI — Stories That Speak</title>
<meta name="description" content="Kahaani AI — a Hindi-first bedtime storytelling app. Pick a folk tale or write your own, and hear it told in a warm Indian storyteller's voice, with each line lighting up as it is read." />
<meta name="theme-color" content="#13101e" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+Devanagari:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ================= tokens ================= */
:root{
  --font-display:"Baloo 2","Noto Serif Devanagari",system-ui,sans-serif;
  --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-story:"Noto Serif Devanagari",Georgia,"Times New Roman",serif;
  --radius-sm:10px;--radius:16px;--radius-lg:22px;--radius-pill:999px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:72px;
  --shadow-1:0 1px 2px rgba(0,0,0,.28);--shadow-2:0 10px 30px rgba(0,0,0,.32);--shadow-3:0 26px 70px rgba(0,0,0,.46);
  --maxw:1120px;--dur:240ms;--ease:cubic-bezier(.2,.7,.2,1);--player-h:96px;
}
[data-theme="night"]{
  --bg:#13101e;
  --bg-grad:radial-gradient(1100px 620px at 12% -12%,rgba(242,178,92,.12),transparent 62%),radial-gradient(900px 560px at 102% -6%,rgba(143,123,216,.16),transparent 58%),#13101e;
  --surface:#1d1830;--surface-2:#262040;--surface-3:#322a52;
  --border:rgba(255,255,255,.09);--border-strong:rgba(255,255,255,.18);
  --text:#f4eee1;--text-2:#c2b8d5;--text-3:#8b82a4;
  --accent:#f2b25c;--accent-ink:#2a1c07;--accent-2:#e07a5f;--accent-3:#8f7bd8;
  --highlight-bg:rgba(242,178,92,.14);--highlight-line:#f2b25c;--focus:#f2b25c;--glass:rgba(29,24,48,.78);
}
[data-theme="day"]{
  --bg:#fbf6ee;
  --bg-grad:radial-gradient(1100px 620px at 12% -12%,rgba(242,178,92,.26),transparent 62%),radial-gradient(900px 560px at 102% -6%,rgba(143,123,216,.14),transparent 58%),#fbf6ee;
  --surface:#ffffff;--surface-2:#f6efe2;--surface-3:#efe3cf;
  --border:rgba(58,44,28,.13);--border-strong:rgba(58,44,28,.24);
  --text:#2c2216;--text-2:#5f5340;--text-3:#8c8069;
  --accent:#bf7318;--accent-ink:#fffaf0;--accent-2:#c0563b;--accent-3:#6b53b8;
  --highlight-bg:rgba(191,115,24,.13);--highlight-line:#bf7318;--focus:#6b53b8;--glass:rgba(255,255,255,.82);
}
/* ================= base ================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:var(--font-ui);font-size:16px;line-height:1.55;color:var(--text);
  background:var(--bg-grad);background-attachment:fixed;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.15;margin:0;letter-spacing:.2px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
::selection{background:var(--highlight-bg)}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1 0 auto}
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.icon{flex:none}
/* ================= header ================= */
.site-header{position:sticky;top:0;z-index:40;background:var(--glass);backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--border)}
.header__inner{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);min-height:68px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:var(--radius);text-align:left}
.brand__mark{color:var(--accent);filter:drop-shadow(0 0 10px rgba(242,178,92,.35))}
.brand__text{display:flex;flex-direction:column;line-height:1.05}
.brand__name{font-family:var(--font-display);font-size:1.32rem;font-weight:700;letter-spacing:.3px}
.brand__dot{color:var(--accent);margin-left:2px}
.brand__tag{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.header__actions{display:flex;align-items:center;gap:10px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--radius-pill);
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);
  transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease)}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong)}
.icon-btn:active{transform:scale(.94)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--radius-pill);font-size:.78rem;
  font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text-2);white-space:nowrap}
.pill--soft{background:var(--surface-2)}
.pill--lang{font-size:.72rem;letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--text-3)}
/* ================= hero ================= */
.hero{padding:clamp(36px,7vw,72px) 0 clamp(20px,3vw,32px)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.hero__title{font-size:clamp(2rem,6vw,3.4rem);max-width:18ch;letter-spacing:-.01em}
.hero__title .hl{color:var(--accent)}
.hero__sub{margin-top:18px;max-width:56ch;font-size:clamp(1rem,1.6vw,1.12rem);color:var(--text-2)}
/* ================= library ================= */
.lib__head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-5);flex-wrap:wrap}
.section-title{font-size:1.4rem}
.search{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:var(--radius-pill);border:1px solid var(--border);
  background:var(--surface);color:var(--text-3);min-width:220px;transition:border-color var(--dur) var(--ease)}
.search:focus-within{border-color:var(--border-strong)}
.search input{border:none;background:none;outline:none;width:100%;color:var(--text)}
.search input::placeholder{color:var(--text-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--space-4);padding-bottom:var(--space-7)}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:var(--radius-lg);
  border:1px solid var(--border);background:linear-gradient(180deg,var(--surface),var(--surface-2));cursor:pointer;text-align:left;
  overflow:hidden;transition:transform var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.card::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  opacity:0;transition:opacity var(--dur) var(--ease)}
.card:hover{transform:translateY(-3px);border-color:var(--border-strong);box-shadow:var(--shadow-2)}
.card:hover::after{opacity:1}
.card__top{display:flex;align-items:center;justify-content:space-between}
.card__motif{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;
  background:var(--surface-3);color:var(--accent);border:1px solid var(--border)}
.card__title{font-size:1.28rem;margin-top:2px}
.card__sub{font-size:.82rem;color:var(--text-3);letter-spacing:.02em}
.card__moral{font-family:var(--font-story);font-size:.98rem;color:var(--text-2);margin-top:2px}
.card__foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:14px}
.card__play{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius-pill);
  background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:.88rem;transition:transform var(--dur) var(--ease),filter var(--dur) var(--ease)}
.card__play:hover{filter:brightness(1.06)}
.lib__empty{grid-column:1/-1;padding:40px 0;text-align:center;color:var(--text-3)}
/* ================= empty language state ================= */
.empty-lang{grid-column:1/-1;text-align:center;padding:clamp(28px,6vw,56px);border-radius:var(--radius-lg);
  border:1px dashed var(--border-strong);background:var(--surface)}
.empty-lang__title{font-size:1.4rem;margin-bottom:10px}
.empty-lang__body{color:var(--text-2);max-width:46ch;margin:0 auto 20px}
/* ================= create ================= */
.create{padding-bottom:var(--space-8)}
.create__card{display:grid;grid-template-columns:1fr;gap:var(--space-5);padding:clamp(24px,4vw,40px);border-radius:var(--radius-lg);
  border:1px solid var(--border);background:radial-gradient(700px 300px at 100% 0%,rgba(143,123,216,.16),transparent 60%),linear-gradient(180deg,var(--surface),var(--surface-2))}
@media(min-width:820px){.create__card{grid-template-columns:1.05fr .95fr;align-items:center}}
.create__title{font-size:1.6rem;margin-bottom:10px}
.create__desc{color:var(--text-2);max-width:46ch}
.prompt{display:flex;flex-direction:column;gap:12px}
.prompt__label{font-size:.84rem;color:var(--text-3);font-weight:500}
.prompt__input{width:100%;min-height:96px;resize:vertical;padding:14px 16px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--surface);color:var(--text);outline:none;transition:border-color var(--dur) var(--ease)}
.prompt__input:focus{border-color:var(--border-strong)}
.prompt__input::placeholder{color:var(--text-3)}
.prompt__chips{display:flex;flex-wrap:wrap;gap:8px}
.prompt__chip{padding:6px 12px;border-radius:var(--radius-pill);border:1px dashed var(--border-strong);background:transparent;
  color:var(--text-2);font-size:.82rem;transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.prompt__chip:hover{border-color:var(--accent);color:var(--text)}
.prompt__foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;padding:12px 22px;border-radius:var(--radius-pill);font-weight:600;font-size:.95rem;
  transition:transform var(--dur) var(--ease),filter var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.btn--primary{background:var(--accent);color:var(--accent-ink)}
.btn--primary:hover{filter:brightness(1.06)}
.btn--primary:active{transform:scale(.97)}
.prompt__note{font-size:.82rem;color:var(--text-3)}
/* ================= reader ================= */
.reader{padding:clamp(20px,4vw,40px) 0 calc(var(--player-h) + 40px)}
.back{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:var(--radius-pill);
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:.88rem;margin-bottom:var(--space-5);
  transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.back:hover{color:var(--text);border-color:var(--border-strong)}
.story{max-width:46rem;margin-inline:auto}
.story__head{text-align:center;margin-bottom:var(--space-6)}
.story__motif{display:inline-flex;align-items:center;justify-content:center;width:62px;height:62px;border-radius:20px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--accent);margin-bottom:18px;box-shadow:var(--shadow-1)}
.story__title{font-size:clamp(1.8rem,4.5vw,2.6rem)}
.story__sub{color:var(--text-3);font-size:.95rem;margin-top:6px;letter-spacing:.04em}
.story__meta{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:16px}
.story__moral{font-family:var(--font-story);font-style:italic;font-size:1.05rem;color:var(--accent);margin-top:18px}
.story__body{padding:clamp(20px,4vw,36px);border-radius:var(--radius-lg);border:1px solid var(--border);
  background:linear-gradient(180deg,var(--surface),var(--surface-2));box-shadow:var(--shadow-1)}
.story__text{font-family:var(--font-story);font-size:clamp(1.24rem,2.3vw,1.5rem);line-height:2.05;color:var(--text)}
.story__text .s{border-radius:8px;padding:2px 6px;margin:0 -2px;cursor:pointer;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.story__text .s:hover{background:var(--surface-3)}
.story__text .s.is-current{background:var(--highlight-bg);box-shadow:inset 3px 0 0 var(--highlight-line)}
.story__text .s.is-done{color:var(--text-2)}
/* ================= player ================= */
.player-host{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:0 clamp(12px,3vw,28px) max(14px,env(safe-area-inset-bottom));pointer-events:none}
.player{pointer-events:auto;max-width:var(--maxw);margin-inline:auto;border-radius:var(--radius-lg);border:1px solid var(--border-strong);
  background:var(--glass);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  box-shadow:var(--shadow-3);overflow:hidden;animation:rise var(--dur) var(--ease) both}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.player__progress{height:3px;background:var(--border)}
.player__progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width 320ms var(--ease)}
.player__inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--space-4);padding:14px clamp(14px,3vw,22px)}
.player__meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.player__count{font-size:.88rem;font-weight:500}
.player__mode{font-size:.74rem;color:var(--text-3)}
.player__transport{display:flex;align-items:center;gap:8px}
.tbtn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:var(--radius-pill);
  color:var(--text-2);transition:color var(--dur) var(--ease),background var(--dur) var(--ease)}
.tbtn:hover{color:var(--text);background:var(--surface-2)}
.tbtn--play{width:56px;height:56px;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px rgba(242,178,92,.3);
  transition:transform var(--dur) var(--ease),filter var(--dur) var(--ease)}
.tbtn--play:hover{filter:brightness(1.06)}
.tbtn--play:active{transform:scale(.95)}
.player__controls{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>span{font-size:.7rem;color:var(--text-3);letter-spacing:.04em}
.field select{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:7px 9px;
  font-size:.84rem;outline:none;max-width:180px}
.field select:focus{border-color:var(--border-strong)}
/* ================= toast ================= */
.toast{position:fixed;left:50%;bottom:calc(var(--player-h) + 24px);transform:translate(-50%,16px);z-index:60;
  max-width:min(92vw,460px);padding:12px 18px;border-radius:var(--radius-pill);border:1px solid var(--border-strong);
  background:var(--surface-3);color:var(--text);font-size:.88rem;box-shadow:var(--shadow-2);opacity:0;pointer-events:none;
  transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);text-align:center}
.toast.is-visible{opacity:1;transform:translate(-50%,0)}
/* ================= footer ================= */
.site-footer{flex:none;border-top:1px solid var(--border);padding:26px 0 34px;color:var(--text-3);font-size:.82rem}
.footer__inner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.footer__note{max-width:60ch}
/* ================= settings sheet ================= */
.backdrop{position:fixed;inset:0;background:rgba(8,6,14,.55);z-index:70;opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease)}
.backdrop.is-open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);z-index:71;background:var(--surface);
  border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(102%);
  transition:transform 300ms var(--ease);box-shadow:var(--shadow-3)}
.sheet.is-open{transform:none}
.sheet__head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 22px 16px;border-bottom:1px solid var(--border)}
.sheet__title{font-size:1.35rem}
.sheet__sub{font-size:.84rem;color:var(--text-3);margin-top:4px}
.sheet__body{padding:8px 22px 28px;overflow-y:auto;flex:1}
.sec{padding:18px 0;border-bottom:1px solid var(--border)}
.sec:last-child{border-bottom:none}
.sec__title{display:flex;align-items:center;gap:8px;font-size:.76rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:14px}
.row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.row:last-child{margin-bottom:0}
.row>label,.row>.row__label{font-size:.84rem;color:var(--text-2);font-weight:500}
.row select,.row input[type="text"]{width:100%;border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  border-radius:12px;padding:11px 12px;font-size:.92rem;outline:none;transition:border-color var(--dur) var(--ease)}
.row select:focus,.row input[type="text"]:focus{border-color:var(--accent)}
.row__hint{font-size:.76rem;color:var(--text-3)}
.seg{display:flex;gap:8px;background:var(--surface-2);padding:5px;border-radius:var(--radius-pill);border:1px solid var(--border)}
.seg button{flex:1;padding:9px 12px;border-radius:var(--radius-pill);font-size:.86rem;font-weight:500;color:var(--text-2);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.seg button.is-on{background:var(--accent);color:var(--accent-ink)}
.langchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.langchip{font-size:.76rem;padding:5px 10px;border-radius:var(--radius-pill);border:1px solid var(--border);
  background:var(--surface-2);color:var(--text-2)}
.langchip.is-active{border-color:var(--accent);color:var(--accent)}
.langchip.is-muted{opacity:.6}
/* ================= responsive ================= */
@media(max-width:720px){
  :root{--player-h:132px}
  .player__inner{grid-template-columns:1fr auto;grid-template-areas:"meta transport" "controls controls";row-gap:12px}
  .player__meta{grid-area:meta}
  .player__transport{grid-area:transport}
  .player__controls{grid-area:controls;justify-content:space-between}
  .field select{max-width:40vw}
  .brand__tag{display:none}
  .pill--engine{display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div class="backdrop" id="backdrop"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Settings"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><div class="wrap" style="padding:48px 0"><h1>Kahaani AI</h1><p>Enable JavaScript to use this app.</p></div></noscript>

<script>
(function () {
  'use strict';

  /* ============================================================

    'skip-back': '<polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/>',
    'skip-forward': '<polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/>',
    'arrow-left': '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
    moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',

  /* ============================================================
     State + persistence
     ============================================================ */
  // When the page is served over http(s) there is a backend next to it, so
  // default to live narration. Opened straight from disk (file://) there is
  // no backend, so default to the browser preview.
  var SERVED = (typeof location !== 'undefined') && /^https?:$/.test(location.protocol);
  var DEFAULTS = {
    ui: 'hi', storyLang: 'hi-IN', pace: 1, theme: 'night',
    engine: SERVED ? 'live' : 'preview', endpoint: '/api', voice: {}
  };
  var settings = load();
  var view = { name: 'library', story: null };
  var search = '';

  function load() {
    var s = {};
    for (var k in DEFAULTS) s[k] = DEFAULTS[k];
    try {
      var raw = localStorage.getItem('kahaani.settings');
      if (raw) {
        var saved = JSON.parse(raw);
        for (var j in saved) s[j] = saved[j];
      }
    } catch (e) { /* ignore */ }
    return s;
  }
  function save() {
    try { localStorage.setItem('kahaani.settings', JSON.stringify(settings)); } catch (e) { /* ignore */ }
  }

  /* ============================================================
     Helpers
     ============================================================ */
  function t(key, params) {
    var dict = I18N[settings.ui] || I18N.hi;
    var s = dict[key] != null ? dict[key] : (I18N.hi[key] != null ? I18N.hi[key] : key);
    if (params) s = s.replace(/\{(\w+)\}/g, function (m, k) { return params[k] != null ? params[k] : m; });
    return s;
  }
  function esc(v) {
    return String(v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function estimateSeconds(sentences, pace) {
    var chars = sentences.join(' ').length;
    return Math.max(1, Math.round(chars / (13 * (pace || 1))));
  }
  function dur(sec) {
    if (settings.ui === 'en') {
      if (sec < 60) return sec + 's';
      var m1 = Math.floor(sec / 60), s1 = sec % 60;
      return s1 ? m1 + 'm ' + s1 + 's' : m1 + 'm';
    }
    if (sec < 60) return sec + ' सेकंड';
    var m = Math.floor(sec / 60), s = sec % 60;
    return s ? m + ' मिनट ' + s + ' सेकंड' : m + ' मिनट';
  }
  function storiesFor(code) {
    return STORIES.filter(function (s) { return s.lang === code; });
  }
  function voicesFor(code) {
    return VOICES[code] || [];
  }
  function selectedVoice(code) {
    var list = voicesFor(code);
    if (!list.length) return null;
    var want = settings.voice && settings.voice[code];
    for (var i = 0; i < list.length; i++) if (list[i].id === want) return list[i].id;
    return list[0].id;
  }

  /* ============================================================
     Toast
     ============================================================ */
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('is-visible');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('is-visible'); }, 4200);
  }

  /* ============================================================
     Narration (preview + live behind one interface)
     ============================================================ */
  var narToken = 0, narAudio = null, narUtterance = null;

  function narrateStop() {
    narToken++;
    if (narAudio) { try { narAudio.pause(); } catch (e) {} narAudio.src = ''; narAudio = null; }
    if (typeof speechSynthesis !== 'undefined') speechSynthesis.cancel();
    narUtterance = null;
  }
  function pickVoice(langCode) {
    if (typeof speechSynthesis === 'undefined') return null;
    var voices = speechSynthesis.getVoices() || [];
    var base = String(langCode).split('-')[0].toLowerCase();
    for (var i = 0; i < voices.length; i++) if (voices[i].lang === langCode) return voices[i];
    for (var j = 0; j < voices.length; j++) if ((voices[j].lang || '').toLowerCase().indexOf(base) === 0) return voices[j];
    return null;
  }
  function narrate(text, opts) {
    opts = opts || {};
    var pace = opts.pace || 1, speaker = opts.speaker, languageCode = opts.languageCode || 'hi-IN';
    narrateStop();
    var token = narToken;
    var isCurrent = function () { return token === narToken; };
    if (settings.engine === 'live') return narrateLive(text, pace, speaker, languageCode, isCurrent);
    return narratePreview(text, pace, languageCode, isCurrent);
  }
  function narrateLive(text, pace, speaker, languageCode, isCurrent) {
    var url = (settings.endpoint || '/api').replace(/\/$/, '') + '/tts';
    return fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, language_code: languageCode, speaker: speaker, pace: pace })
    }).then(function (res) {
      if (!res.ok) throw new Error('tts ' + res.status);
      return res.blob();
    }).then(function (blob) {
      if (!isCurrent()) throw new DOMException('aborted', 'AbortError');
      return new Promise(function (resolve, reject) {
        var audio = new Audio(URL.createObjectURL(blob));
        narAudio = audio;
        audio.playbackRate = Math.min(2, Math.max(0.5, pace));
        audio.onended = function () { narAudio = null; resolve(); };
        audio.onerror = function () { narAudio = null; reject(new Error('audio-failed')); };
        audio.play().catch(reject);
      });
    });
  }
  function narratePreview(text, pace, languageCode, isCurrent) {
    if (typeof speechSynthesis === 'undefined') return Promise.reject(new Error('no-speech'));
    return new Promise(function (resolve, reject) {
      var u = new SpeechSynthesisUtterance(text);
      var v = pickVoice(languageCode);
      if (v) u.voice = v;
      u.lang = languageCode;
      u.rate = Math.min(2, Math.max(0.5, pace));
      u.pitch = 1;
      narUtterance = u;
      var settled = false;
      var settle = function (fn, arg) { if (!settled) { settled = true; fn(arg); } };
      u.onend = function () { settle(resolve); };
      u.onerror = function (e) { settle(reject, new Error('speech:' + ((e && e.error) || 'x'))); };
      if (!isCurrent()) { settle(reject, new DOMException('aborted', 'AbortError')); return; }
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    });
  }

  /* ============================================================
     Shell
     ============================================================ */
  function applyTheme() {
    document.documentElement.dataset.theme = settings.theme;
    document.documentElement.lang = settings.ui === 'en' ? 'en' : 'hi';
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', settings.theme === 'night' ? '#13101e' : '#fbf6ee');
  }

    var app = document.getElementById('app');

          '<span class="brand__text"><span class="brand__name">Kahaani<span class="brand__dot">AI</span></span>' +
          '<span class="brand__tag" id="brand-tag"></span></span>' +
        '</button>' +
        '<div class="header__actions">' +
          '<span class="pill pill--soft pill--engine" id="engine-pill">' + icon('volume', 15) + ' <span></span></span>' +
          '<button class="icon-btn" data-act="theme" type="button" aria-label="theme"></button>' +
          '<button class="icon-btn" data-act="settings" type="button" id="settings-btn" aria-label="settings">' + icon('settings', 18) + '</button>' +
        '</div>' +
      '</div></header>' +
      '<main class="main" id="main"></main>' +
      '<footer class="site-footer"><div class="wrap footer__inner">' +
        '<span id="foot-l"></span><span class="footer__note" id="foot-r"></span>' +
      '</div></footer>';

    app.querySelector('[data-act="home"]').addEventListener('click', function () { go({ name: 'library', story: null }); });
    app.querySelector('[data-act="theme"]').addEventListener('click', function () {
      settings.theme = settings.theme === 'night' ? 'day' : 'night'; save(); applyTheme(); paintChrome(); paintSettings();
    });
    app.querySelector('[data-act="settings"]').addEventListener('click', openSheet);
  }

  function paintChrome() {
    var tag = document.getElementById('brand-tag');
    if (tag) tag.textContent = t('brand_tag');
    var fl = document.getElementById('foot-l'); if (fl) fl.textContent = t('footer_l');
    var fr = document.getElementById('foot-r'); if (fr) fr.textContent = t('footer_r');
    var sb = document.getElementById('settings-btn'); if (sb) sb.setAttribute('aria-label', t('settings'));
    var th = document.querySelector('[data-act="theme"]');
    if (th) { th.innerHTML = icon(settings.theme === 'night' ? 'sun' : 'moon', 18); th.setAttribute('aria-label', t('lbl_theme')); }
    var pill = document.getElementById('engine-pill');
    if (pill) {
      pill.querySelector('span').textContent = settings.engine === 'live' ? t('engine_live') : t('engine_preview');
    }
  }

  /* ============================================================
     Views
     ============================================================ */
  function go(next) {
    narrateStop();
    Object.assign(view, next);
    render();
  }

  function render() {
    paintChrome();
    var main = document.getElementById('main');
    if (view.name === 'reader' && view.story) renderReader(main);
    else renderLibrary(main);
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function renderLibrary(main) {
    var list = storiesFor(settings.storyLang);
    main.innerHTML =
      '<section class="hero wrap">' +
        '<p class="eyebrow">' + icon('book', 15) + ' ' + t('hero_eyebrow') + '</p>' +
        '<h1 class="hero__title">' + t('hero_t1') + '<span class="hl">' + t('hero_hl') + '</span>' + t('hero_t2') + '</h1>' +
        '<p class="hero__sub">' + t('hero_sub') + '</p>' +
      '</section>' +
      '<section class="wrap">' +
        '<div class="lib__head">' +
          '<h2 class="section-title">' + t('lib_title') + '</h2>' +

            '<input id="lib-search" type="search" placeholder="' + esc(t('search_ph')) + '" aria-label="' + esc(t('search_ph')) + '" />' +

    function paintGrid() {
      if (!list.length) {
        grid.innerHTML =

          '</div>';
        var cta = document.getElementById('empty-cta');
        if (cta) cta.addEventListener('click', openSheet);
        return;
      }
      var q = search.trim().toLowerCase();
      var filtered = !q ? list : list.filter(function (s) {
        return s.title.toLowerCase().indexOf(q) >= 0 || s.sub.toLowerCase().indexOf(q) >= 0 || s.moral.toLowerCase().indexOf(q) >= 0;

      grid.innerHTML = filtered.map(function (s) {

      }).join('');

        var open = function () { go({ name: 'reader', story: STORIES.filter(function (s) { return s.id === el.dataset.id; })[0] }); };

    });
    document.getElementById('prompt-create').addEventListener('click', function () {
      toast(pin.value.trim() ? t('toast_gen') : t('toast_idea'));
    });

  function renderReader(main) {
    var story = view.story;
    var state = { index: 0, playing: false };
    var voiceId = selectedVoice(story.lang);

    main.innerHTML =
      '<div class="reader wrap">' +

    var spanEls = Array.prototype.slice.call(document.querySelectorAll('.s'));
    var host = document.getElementById('player-host');
    var list = voicesFor(story.lang);
    var voiceOpts = list.length
      ? list.map(function (v) { return '<option value="' + v.id + '">' + esc(v.name) + ' \u2014 ' + esc(v.style) + '</option>'; }).join('')
      : '<option value="">' + esc(t('voice_na')) + '</option>';
    var paceOpts = [[0.8, t('pace_slow')], [1, t('pace_normal')], [1.2, t('pace_fast')]]
      .map(function (p) { return '<option value="' + p[0] + '">' + esc(p[1]) + '</option>'; }).join('');

    host.innerHTML =
      '<div class="player" role="region"><div class="player__progress"><div class="player__progress-bar" data-el="bar"></div></div>' +
      '<div class="player__inner">' +
        '<div class="player__meta"><span class="player__count" data-el="count"></span><span class="player__mode" data-el="mode"></span></div>' +
        '<div class="player__transport">' +
          '<button class="tbtn" data-act="prev" type="button" aria-label="' + esc(t('prev')) + '">' + icon('skip-back', 20) + '</button>' +
          '<button class="tbtn tbtn--play" data-act="toggle" data-el="toggle" type="button"></button>' +
          '<button class="tbtn" data-act="next" type="button" aria-label="' + esc(t('next')) + '">' + icon('skip-forward', 20) + '</button>' +
        '</div>' +
        '<div class="player__controls">' +
          '<label class="field"><span>' + t('pace') + '</span><select data-el="pace" aria-label="' + esc(t('pace')) + '">' + paceOpts + '</select></label>' +
          '<label class="field"><span>' + t('voice') + '</span><select data-el="voice" aria-label="' + esc(t('voice')) + '">' + voiceOpts + '</select></label>' +
          '<button class="icon-btn" data-act="export" type="button" aria-label="' + esc(t('download')) + '" title="' + esc(t('download')) + '" disabled>' + icon('download', 18) + '</button>' +
        '</div>' +
      '</div></div>';

    var el = {
      count: host.querySelector('[data-el="count"]'),
      mode: host.querySelector('[data-el="mode"]'),
      toggle: host.querySelector('[data-el="toggle"]'),
      bar: host.querySelector('[data-el="bar"]'),
      pace: host.querySelector('[data-el="pace"]'),
      voice: host.querySelector('[data-el="voice"]')
    };

    function paint() {
      spanEls.forEach(function (s, i) {
        s.classList.toggle('is-current', i === state.index);
        s.classList.toggle('is-done', i < state.index);
      });
      if (state.playing && spanEls[state.index]) {
        var r = spanEls[state.index].getBoundingClientRect();
        if (r.top < 120 || r.bottom > window.innerHeight - 170) {
          spanEls[state.index].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
      el.count.textContent = t('player_count', { i: state.index + 1, n: story.sentences.length });
      el.mode.textContent = settings.engine === 'live' ? t('engine_live') : t('engine_preview');
      el.mode.style.color = settings.engine === 'live' ? 'var(--accent)' : '';
      el.toggle.innerHTML = icon(state.playing ? 'pause' : 'play', 24);
      el.toggle.setAttribute('aria-label', state.playing ? t('pause') : t('play'));
      var total = story.sentences.length;
      var pct = total <= 1 ? (state.playing ? 100 : 0) : Math.round(((state.index + (state.playing ? 1 : 0)) / total) * 100);
      el.bar.style.width = pct + '%';
      el.pace.value = String(settings.pace);
      if (list.length) el.voice.value = voiceId || list[0].id;
    }

    function playCurrent() {
      var i = state.index;
      if (i < 0 || i >= story.sentences.length) return finish();
      paint();
      narrate(story.sentences[i], { pace: settings.pace, speaker: voiceId, languageCode: story.lang })
        .then(function () {
          if (!state.playing) return;
          if (i + 1 < story.sentences.length) { state.index = i + 1; playCurrent(); }
          else finish();
        })
        .catch(function (err) {
          if (err && err.name === 'AbortError') return;
          if (settings.engine === 'live') {
            settings.engine = 'preview'; paintChrome(); paintSettings(); // session-only: not persisted, so a reload retries live
            toast(t('toast_live'));
            if (state.playing) playCurrent();
            return;
          }
          state.playing = false; paint(); toast(t('toast_err'));
        });
    }
    function play() { state.playing = true; paint(); playCurrent(); }
    function pause() { state.playing = false; narrateStop(); paint(); }
    function finish() { state.playing = false; state.index = story.sentences.length - 1; narrateStop(); paint(); toast(t('toast_done')); }
    function jump(i) {
      state.index = Math.max(0, Math.min(story.sentences.length - 1, i));
      if (state.playing) playCurrent(); else paint();
    }

    el.toggle.addEventListener('click', function () { state.playing ? pause() : play(); });
    host.querySelector('[data-act="prev"]').addEventListener('click', function () { jump(state.index - 1); });
    host.querySelector('[data-act="next"]').addEventListener('click', function () { jump(state.index + 1); });
    el.pace.addEventListener('change', function (e) { settings.pace = Number(e.target.value); save(); });
    el.voice.addEventListener('change', function (e) {
      voiceId = e.target.value;
      settings.voice = settings.voice || {}; settings.voice[story.lang] = voiceId; save();
    });

    spanEls.forEach(function (s) {
      var goTo = function () { state.index = Number(s.dataset.i); state.playing = true; playCurrent(); };
      s.addEventListener('click', goTo);
      s.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goTo(); } });
    });

    document.querySelector('[data-act="back"]').addEventListener('click', function () { go({ name: 'library', story: null }); });

    paint();
  }

  /* ============================================================
     Settings sheet
     ============================================================ */
  var backdrop = document.getElementById('backdrop');
  var sheet = document.getElementById('sheet');

  function openSheet() {
    sheet.classList.add('is-open');
    backdrop.classList.add('is-open');
    paintSettings();
    var first = sheet.querySelector('select, button');
    if (first) first.focus();
  }
  function closeSheet() {
    sheet.classList.remove('is-open');
    backdrop.classList.remove('is-open');
  }
  backdrop.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  function paintSettings() {
    var uiOpts = [['hi', 'हिन्दी'], ['en', 'English']].map(function (o) {
      return '<option value="' + o[0] + '"' + (settings.ui === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('');

    var langOpts = LANGS.map(function (l) {
      var n = storiesFor(l.code).length;
      var label = (settings.ui === 'en' ? l.en : l.hi) + ' \u2014 ' +
        (n ? t('stories_count', { n: n }) : t('coming_soon'));
      return '<option value="' + l.code + '"' + (settings.storyLang === l.code ? ' selected' : '') + '>' + esc(label) + '</option>';
    }).join('');

    var chips = LANGS.map(function (l) {
      var n = storiesFor(l.code).length;
      var cls = 'langchip' + (l.code === settings.storyLang ? ' is-active' : '') + (n ? '' : ' is-muted');
      return '<span class="' + cls + '">' + esc(l.native) + '</span>';
    }).join('');

    var voices = voicesFor(settings.storyLang);
    var voiceBlock = voices.length
      ? '<div class="row"><label for="set-voice">' + t('voice') + '</label><select id="set-voice">' +
          voices.map(function (v) {
            return '<option value="' + v.id + '"' + (selectedVoice(settings.storyLang) === v.id ? ' selected' : '') + '>' +
              esc(v.name) + ' \u2014 ' + esc(v.style) + '</option>';
          }).join('') + '</select></div>'
      : '<p class="row__hint">' + t('voice_na') + '</p>';

    sheet.innerHTML =
      '<div class="sheet__head">' +
        '<div><h2 class="sheet__title">' + t('settings_title') + '</h2><p class="sheet__sub">' + t('settings_sub') + '</p></div>' +
        '<button class="icon-btn" data-act="close" type="button" aria-label="' + esc(t('close')) + '">' + icon('x', 18) + '</button>' +
      '</div>' +
      '<div class="sheet__body">' +
        '<section class="sec"><h3 class="sec__title">' + icon('book', 14) + ' ' + t('sec_language') + '</h3>' +
          '<div class="row"><label for="set-ui">' + t('lbl_ui') + '</label><select id="set-ui">' + uiOpts + '</select></div>' +
          '<div class="row"><label for="set-story">' + t('lbl_story') + '</label><select id="set-story">' + langOpts + '</select>' +
            '<span class="row__hint">' + t('supported') + ' \u00B7 ' + t('ml_od_note') + '</span>' +
            '<div class="langchips">' + chips + '</div>' +
          '</div>' +
        '</section>' +
        '<section class="sec"><h3 class="sec__title">' + icon('volume', 14) + ' ' + t('sec_voice') + '</h3>' + voiceBlock +
          '<div class="row"><span class="row__label">' + t('pace') + '</span><div class="seg" id="seg-pace">' +
            [[0.8, t('pace_slow')], [1, t('pace_normal')], [1.2, t('pace_fast')]].map(function (p) {
              return '<button type="button" data-pace="' + p[0] + '" class="' + (settings.pace === p[0] ? 'is-on' : '') + '">' + esc(p[1]) + '</button>';
            }).join('') + '</div></div>' +
        '</section>' +
        '<section class="sec"><h3 class="sec__title">' + icon('sun', 14) + ' ' + t('sec_appearance') + '</h3>' +
          '<div class="row"><span class="row__label">' + t('lbl_theme') + '</span><div class="seg" id="seg-theme">' +
            '<button type="button" data-theme="night" class="' + (settings.theme === 'night' ? 'is-on' : '') + '">' + esc(t('theme_night')) + '</button>' +
            '<button type="button" data-theme="day" class="' + (settings.theme === 'day' ? 'is-on' : '') + '">' + esc(t('theme_day')) + '</button>' +
          '</div></div>' +
        '</section>' +
        '<section class="sec"><h3 class="sec__title">' + icon('sparkles', 14) + ' ' + t('sec_narration') + '</h3>' +
          '<div class="row"><span class="row__label">' + t('lbl_engine') + '</span><div class="seg" id="seg-engine">' +
            '<button type="button" data-engine="preview" class="' + (settings.engine === 'preview' ? 'is-on' : '') + '">' + esc(t('engine_preview')) + '</button>' +
            '<button type="button" data-engine="live" class="' + (settings.engine === 'live' ? 'is-on' : '') + '">' + esc(t('engine_live')) + '</button>' +
          '</div></div>' +
          '<div class="row"><label for="set-endpoint">' + t('lbl_endpoint') + '</label>' +
            '<input id="set-endpoint" type="text" value="' + esc(settings.endpoint) + '" />' +
            '<span class="row__hint">' + t('endpoint_hint') + '</span>' +
          '</div>' +
        '</section>' +
      '</div>';

    sheet.querySelector('[data-act="close"]').addEventListener('click', closeSheet);
    sheet.querySelector('#set-ui').addEventListener('change', function (e) {
      settings.ui = e.target.value; save(); refreshAll();
    });
    sheet.querySelector('#set-story').addEventListener('change', function (e) {
      settings.storyLang = e.target.value; save(); afterStoryLangChange();
    });
    var sv = sheet.querySelector('#set-voice');
    if (sv) sv.addEventListener('change', function (e) {
      settings.voice = settings.voice || {}; settings.voice[settings.storyLang] = e.target.value; save();
    });
    sheet.querySelectorAll('#seg-pace button').forEach(function (b) {
      b.addEventListener('click', function () { settings.pace = Number(b.dataset.pace); save(); paintSettings(); });
    });
    sheet.querySelectorAll('#seg-theme button').forEach(function (b) {
      b.addEventListener('click', function () { settings.theme = b.dataset.theme; save(); applyTheme(); paintChrome(); paintSettings(); });
    });
    sheet.querySelectorAll('#seg-engine button').forEach(function (b) {
      b.addEventListener('click', function () { settings.engine = b.dataset.engine; save(); paintChrome(); paintSettings(); });
    });
    sheet.querySelector('#set-endpoint').addEventListener('change', function (e) {
      settings.endpoint = e.target.value.trim() || '/api'; save();
    });
  }

  function refreshAll() { applyTheme(); render(); if (sheet.classList.contains('is-open')) paintSettings(); }
  function afterStoryLangChange() {
    if (view.name === 'reader' && view.story && view.story.lang !== settings.storyLang) {
      go({ name: 'library', story: null });
    } else {
      render();
    }
    paintSettings();
  }

  /* ============================================================
     Boot
     ============================================================ */
  applyTheme();
  shell();
  render();

  // Some browsers populate voices asynchronously; nothing to do but let the
  // next pickVoice() call see them.
  if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = function () {};
  }
})();
</script>
</body>
</html>
